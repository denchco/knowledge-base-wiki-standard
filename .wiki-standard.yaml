schema: "https://denchco.github.io/knowledge-base-wiki-documentation/schema/manifest-v1.json"
standard:
  name: "DenchCo Knowledge Base Wiki Standard"
  version: "0.1.0-candidate"
  source: "https://github.com/denchco/knowledge-base-wiki-standard"
profile: "standard-production"
okf_version: "0.2"
roles:
  specification: "docs/spec/index.md"
  source_register: "docs/sources.md"
  evidence_matrix: "docs/evidence-matrix.md"
  validation_queue: "docs/validation-queue.md"
  research_log: "docs/log.md"
  human_wiki: "docs/index.md"
  governing_question: "docs/index.md"
  llm_wiki: "docs/llm-wiki/index.md"
  design_contract: "DESIGN.md"
  okf_bundle: "knowledge"
capabilities:
  evidence_governance: true
  human_wiki: true
  human_wiki_url: "http://127.0.0.1:8017/"
  governing_question:
    reader_sources:
      - "docs/index.md"
      - "docs/architecture.md"
  llm_wiki: true
  development_response_links: "live-wiki"
  human_renderer: "zensical"
  llm_artifacts: true
  graphify: true
  okf_export: true
  local_browser_runtimes: true
  browser_verification: true
  local_service: "macos-launchd"
  deployment: false
  jujutsu: true
  standard_change_intake: true
  public_repository: "https://github.com/denchco/knowledge-base-wiki-standard"
  public_documentation: "https://denchco.github.io/knowledge-base-wiki-documentation/"
  documentation_sync: "snapshot-v1"
deviations: []
