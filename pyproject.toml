[project]
name = "denchco-knowledge-base-wiki-standard"
version = "0.1.0rc0"
description = "Canonical OKF-compatible standard for evidence-governed human and AI wikis."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "graphifyy==0.9.70",
  "zensical==0.0.59",
]

[tool.uv]
# Dependency-update resolvers may advance; check:toolchain qualifies exactly 0.13.4.
required-version = ">=0.13.4"
package = false
# Security floor for CacheControl's file-cache dependency.
constraint-dependencies = ["filelock>=4.2.4"]

[dependency-groups]
dev = [
  "pip-audit==2.10.1",
]
