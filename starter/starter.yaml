schema_version: "1.0"
id: "denchco-subject-empty"
description: "Allowlisted recipe for creating an independent, subject-specific knowledge-base repository."
standard_source: "https://github.com/denchco/knowledge-base-wiki-standard"
documentation: "https://denchco.github.io/knowledge-base-wiki-documentation/"
revision_policy: "automatically-resolve-default-branch-head-to-commit"
repository_boundary: "independent-target"
root_copy: "forbidden"
content_policy: "subject-specific-create-fresh"
deployment_policy: "consumer-owned"
bootstrap:
  invocation: "standard-repository-url-only"
  first_question: "research-topic-seed-or-subject-empty-local-wiki"
  modes: ["research-topic-seed", "subject-empty-local"]
  defaults:
    profile: "standard-production"
    primary_color: "#174a5b"
    accent_color: "#0b7285"
    target_path: "infer-independent-local-path"
    wiki_url: "auto-reserve-conflict-free-loopback"
    local_service: "auto-select-platform-user-service-adapter"
    deployment: "none"
  inspect_before_asking: ["research seed", "existing target", "design contract", "repository boundary"]
  conditional_questions: ["research extent", "missing purpose detail", "sensitive or restricted source handling", "target collision"]
  required_design_question: "state the inferred or default accent hex and ask whether to use or replace it"
  accent_derivation: "derive and record an accessible family; verify 4.5:1 normal-text and 3:1 non-text boundary contrast against rendered backgrounds"
  no_question_defaults: ["profile", "standard revision", "loopback URL", "local service adapter", "no deployment"]
executable_scope:
  apply_supported: false
  portable_core: "Templates define the authoring boundary; validate the completed target with the CLI and schemas from the pinned standard release."
  standard_production: "Planning only until an implementation agent supplies and verifies the complete consumer renderer, script, schema, profile, runtime, lock, CI, and provenance dependency closure from the pinned release. Standard-maintainer documentation-sync commands and verify:workspace are excluded unless the consumer independently declares and implements that capability."

classifications:
  reference_only:
    description: "Read from the pinned standard; never install as target content."
    paths:
      - "docs/spec/"
      - "docs/conformance/"
      - "docs/reference/"
      - "docs/project/"
      - "knowledge/"
      - "profiles/"
      - "schema/"
      - "prompts/"
      - "CHANGELOG.md"
  render_template:
    description: "Render into the independent target after replacing every placeholder."
  create_subject_content:
    description: "Create from the target topic and its own evidence; never derive from the standard corpus."
  adapt_from_release:
    description: "Planning-only selection: inspect the pinned release, bring the complete dependency closure for the chosen adapter, and verify it in the target; never copy the repository root."
  generated:
    description: "Rebuild in the target and keep outside canonical authoring."
    paths:
      - "site/"
      - "graphify-out/"
      - "docs/assets/vendor/"
      - "docs/assets/graphify/"
      - "output/"

never_copy_as_consumer_content:
  - "the standard's docs/ tree"
  - "the standard's knowledge/ bundle"
  - "dogfood reports or fixtures"
  - "the standard's source register, evidence matrix, validation queue, or research log"
  - "the standard documentation repository or its Pages workflow"
  - "the Standard-maintained standard-proposals/registry.json or any Standard decision/release authority"

consumer_owned:
  - "title, topic, audience, governing question, and intended outcome"
  - "accent colour and derived accessible colour family"
  - "canonical Wiki URL"
  - "stable local service identity, registered endpoint, and platform user-service adapter"
  - "source and evidence corpus"
  - "repository licence decision, rights holder, and any resulting LICENSE text"
  - "navigation and synthesis"
  - "deployment adapter, credentials, repository settings, and domain"
  - "tracked proposal origin records, payload approvals, issue observations, and optional adoption decisions"

entries:
  - target: ".wiki-standard.yaml"
    role: "manifest"
    classification: "render-template"
    template: "starter/templates/wiki-standard.yaml.tmpl"
    requirements: ["DKBWS-CORE-002", "DKBWS-HUMAN-004", "DKBWS-UPDATE-002"]
    always: true
  - target: "AGENTS.md"
    role: "agent-contract"
    classification: "render-template"
    template: "starter/templates/AGENTS.md.tmpl"
    requirements: ["DKBWS-PROMPT-001", "DKBWS-PROV-001", "DKBWS-HUMAN-004", "DKBWS-LINK-002", "DKBWS-UPDATE-002"]
    always: true
  - target: "CLAUDE.md"
    role: "claude-agent-contract"
    classification: "render-template"
    template: "starter/templates/CLAUDE.md.tmpl"
    requirements: ["DKBWS-PROMPT-001"]
    always: true
  - target: "DEPENDENCIES.md"
    role: "dependency-contract"
    classification: "render-template"
    template: "starter/templates/DEPENDENCIES.md.tmpl"
    requirements: ["DKBWS-PROV-001", "DKBWS-RUNTIME-002", "DKBWS-UPDATE-002", "DKBWS-VERIFY-001"]
    always: true
  - target: "SECURITY.md"
    role: "security-policy"
    classification: "render-template"
    template: "starter/templates/SECURITY.md.tmpl"
    requirements: ["DKBWS-SEC-001", "DKBWS-UPDATE-002"]
    always: true
  - target: "SOURCE_POLICY.md"
    role: "source-policy"
    classification: "render-template"
    template: "starter/templates/SOURCE_POLICY.md.tmpl"
    requirements: ["DKBWS-SEC-001", "DKBWS-LINK-002", "DKBWS-UPDATE-002"]
    always: true
  - target: "LICENSING.md"
    role: "licensing-record"
    classification: "render-template"
    template: "starter/templates/LICENSING.md.tmpl"
    requirements: ["DKBWS-SEC-001", "DKBWS-UPDATE-002"]
    always: true
  - target: "standard-proposals/README.md"
    role: "consumer-proposal-boundary"
    classification: "render-template"
    template: "starter/templates/standard-proposals/README.md.tmpl"
    requirements: ["DKBWS-UPDATE-002"]
    always: true
  - target: "knowledge/index.md"
    role: "okf-index"
    classification: "render-template"
    template: "starter/templates/knowledge/index.md.tmpl"
    requirements: ["DKBWS-OKF-001", "DKBWS-OKF-003"]
    always: true
  - target: "knowledge/log.md"
    role: "okf-log"
    classification: "render-template"
    template: "starter/templates/knowledge/log.md.tmpl"
    requirements: ["DKBWS-OKF-001"]
    always: true
  - target: "knowledge/concepts/"
    role: "okf-concepts"
    classification: "create-subject-content"
    requirements: ["DKBWS-OKF-001"]
    always: true
  - target: "docs/sources.md"
    role: "source-register"
    classification: "render-template"
    template: "starter/templates/docs/sources.md.tmpl"
    requirements: ["DKBWS-EVID-001", "DKBWS-LINK-002"]
  - target: "docs/evidence-matrix.md"
    role: "evidence-matrix"
    classification: "render-template"
    template: "starter/templates/docs/evidence-matrix.md.tmpl"
    requirements: ["DKBWS-EVID-002", "DKBWS-LINK-002"]
  - target: "docs/validation-queue.md"
    role: "validation-queue"
    classification: "render-template"
    template: "starter/templates/docs/validation-queue.md.tmpl"
    requirements: ["DKBWS-EVID-002", "DKBWS-LINK-002"]
  - target: "docs/log.md"
    role: "research-log"
    classification: "render-template"
    template: "starter/templates/docs/log.md.tmpl"
    requirements: ["DKBWS-EVID-002", "DKBWS-LINK-002"]
  - target: "docs/index.md"
    role: "human-wiki"
    classification: "render-template"
    template: "starter/templates/docs/index.md.tmpl"
    requirements: ["DKBWS-HUMAN-001", "DKBWS-HUMAN-002", "DKBWS-HUMAN-003", "DKBWS-HUMAN-004", "DKBWS-LINK-002"]
  - target: "docs/llm-wiki/index.md"
    role: "llm-wiki"
    classification: "render-template"
    template: "starter/templates/docs/llm-wiki/index.md.tmpl"
    requirements: ["DKBWS-LLM-001", "DKBWS-PROV-001", "DKBWS-HUMAN-004", "DKBWS-LINK-002", "DKBWS-UPDATE-002"]
  - target: "docs/llm-wiki/context-map.md"
    role: "llm-context-map"
    classification: "render-template"
    template: "starter/templates/docs/llm-wiki/context-map.md.tmpl"
    requirements: ["DKBWS-LLM-001", "DKBWS-UPDATE-002"]
  - target: "docs/llm-wiki/maintenance.md"
    role: "llm-maintenance"
    classification: "render-template"
    template: "starter/templates/docs/llm-wiki/maintenance.md.tmpl"
    requirements: ["DKBWS-LLM-001", "DKBWS-PROV-001", "DKBWS-HUMAN-004", "DKBWS-LINK-002", "DKBWS-UPDATE-002"]
  - target: "docs/llm-wiki/standard-proposals.md"
    role: "consumer-proposal-workflow"
    classification: "render-template"
    template: "starter/templates/docs/llm-wiki/standard-proposals.md.tmpl"
    requirements: ["DKBWS-LLM-001", "DKBWS-PROV-001", "DKBWS-UPDATE-002"]
  - target: "docs/project/status.md"
    role: "project-status"
    classification: "render-template"
    template: "starter/templates/docs/project/status.md.tmpl"
    requirements: ["DKBWS-PROMPT-001"]
    always: true
  - target: "DESIGN.md"
    role: "design-contract"
    classification: "render-template"
    template: "starter/templates/DESIGN.md.tmpl"
    requirements: ["DKBWS-DESIGN-001", "DKBWS-HUMAN-002", "DKBWS-HUMAN-003", "DKBWS-HUMAN-004", "DKBWS-LINK-002"]
  - target: "zensical.toml"
    role: "renderer-config"
    classification: "render-template"
    template: "starter/templates/zensical.toml.tmpl"
    requirements: ["DKBWS-RENDER-001", "DKBWS-HUMAN-003"]
  - target: "docs/assets/"
    role: "local-runtime-assets"
    classification: "adapt-from-release"
    source: "docs/assets/"
    planning_only: true
    dependency_closure: "renderer scripts, local browser packages, exact locks, and verification gates; exclude the Standard's service marker because the project-owned marker is rendered separately"
    requirements: ["DKBWS-RENDER-001", "DKBWS-HUMAN-002", "DKBWS-HUMAN-003", "DKBWS-HUMAN-004", "DKBWS-LINK-002"]
  - target: "docs/assets/service-identity.json"
    role: "managed-service-identity"
    classification: "render-template"
