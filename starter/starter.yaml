    requirements: ["DKBWS-UPDATE-002", "DKBWS-VERIFY-001"]
  - target: "fixtures/nonconforming/standard-proposal-form/"
    role: "standard-proposal-form-fixtures"
    classification: "adapt-from-release"
    source: "fixtures/nonconforming/standard-proposal-form/"
    planning_only: true
    dependency_closure: "changed/missing governed form and label fail-closed fixtures"
    requirements: ["DKBWS-UPDATE-002", "DKBWS-VERIFY-001"]
  - target: "standard-proposals/standard-change-form-v1.yml"
