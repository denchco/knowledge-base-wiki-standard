  - target: "package.json"
    role: "node-build-contract"
    classification: "adapt-from-release"
    source: "package.json"
    planning_only: true
    dependency_closure: "all consumer scripts, schemas, profiles, assets, locks, and workflow inputs referenced by the adapted package contract; exclude Standard-maintainer sync:documentation:* and verify:workspace unless independently declared"
    requirements: ["DKBWS-VERIFY-001", "DKBWS-HUMAN-004", "DKBWS-LINK-002", "DKBWS-RUNTIME-001", "DKBWS-RUNTIME-002", "DKBWS-UPDATE-002"]
  - target: "scripts/dev-service.mjs"
    role: "managed-local-service"
    classification: "adapt-from-release"
    source: "scripts/dev-service.mjs"
    planning_only: true
    dependency_closure: "project-unique service identity, versioned static marker, serialized and atomically replaced user-scoped shared register, live-listener preflight, platform user-service install/load/status checks, exact canonical browser handoff, and fixture suite"
    requirements: ["DKBWS-RUNTIME-001", "DKBWS-RUNTIME-002", "DKBWS-VERIFY-001"]
  - target: "scripts/dev-service.test.mjs"
    role: "managed-local-service-fixtures"
    classification: "adapt-from-release"
    source: "scripts/dev-service.test.mjs"
    planning_only: true
    dependency_closure: "the adapted managed-service wrapper, Node test runner, temporary loopback listeners, and project service identity"
    requirements: ["DKBWS-RUNTIME-002", "DKBWS-VERIFY-001"]
  - target: "schema/service-identity-v1.json"
    role: "managed-service-identity-schema"
    classification: "adapt-from-release"
    source: "schema/service-identity-v1.json"
    planning_only: true
    dependency_closure: "the static service marker and schema-validation gate"
    requirements: ["DKBWS-RUNTIME-002", "DKBWS-VERIFY-002"]
  - target: "scripts/jj-phase.mjs"
    role: "development-turn-provenance"
    classification: "adapt-from-release"
    source: "scripts/jj-phase.mjs"
    planning_only: true
    dependency_closure: "the target's complete verification command, Git/Jujutsu status inspection, failed-check disclosure, clean-turn guard, and end-of-turn commit tests"
    requirements: ["DKBWS-PROV-001", "DKBWS-VERIFY-001"]
  - target: "scripts/link-source-citations.mjs"
    role: "reader-source-link-check"
    classification: "adapt-from-release"
    source: "scripts/link-source-citations.mjs"
    planning_only: true
    dependency_closure: "mapped reader evidence surfaces, source-register path and identity grammar, stable row anchors, optional idempotent rewrite, lint fixtures, visible citation styling, and built-output exact-row browser proof"
    requirements: ["DKBWS-LINK-002", "DKBWS-VERIFY-001"]
  - target: "scripts/check-governing-question-repetitions.mjs"
    role: "governing-question-consistency-check"
    classification: "adapt-from-release"
    source: "scripts/check-governing-question-repetitions.mjs"
    planning_only: true
    dependency_closure: "mapped authoritative canonical-question source, bounded reader-source declaration, exact-text positive/negative/subject-empty fixtures, implementation-specific marker parsing, and built-output proof over every repetition route"
    requirements: ["DKBWS-HUMAN-002", "DKBWS-HUMAN-004", "DKBWS-VERIFY-001"]
  - target: "scripts/check-governing-question-repetitions.test.mjs"
    role: "governing-question-consistency-fixtures"
    classification: "adapt-from-release"
    source: "scripts/check-governing-question-repetitions.test.mjs"
    planning_only: true
    dependency_closure: "the adapted governing-question checker and conforming, nonconforming, neutral, historical-record, and subject-empty fixture corpus"
    requirements: ["DKBWS-HUMAN-004", "DKBWS-VERIFY-001"]
  - target: "scripts/standard-proposal-core.mjs"
    role: "standard-proposal-core"
    classification: "adapt-from-release"
    source: "scripts/standard-proposal-core.mjs"
    planning_only: true
    dependency_closure: "the tracked proposal directory, record and registry schemas, governed form revision/labels, immutable origin checks, scrubbed payload renderer, marker search, explicit transition authorities, and test fixtures"
    requirements: ["DKBWS-UPDATE-002", "DKBWS-VERIFY-001"]
  - target: "scripts/standard-proposal-cli.mjs"
    role: "standard-proposal-cli"
    classification: "adapt-from-release"
    source: "scripts/standard-proposal-cli.mjs"
    planning_only: true
    dependency_closure: "the proposal core, package wrapper, tracked records, disposable output directory, schemas, governed form, and browser-open adapter; no remote-write dependency"
    requirements: ["DKBWS-UPDATE-002", "DKBWS-VERIFY-001"]
  - target: "scripts/standard-proposal-cli.test.mjs"
    role: "standard-proposal-fixtures"
    classification: "adapt-from-release"
    source: "scripts/standard-proposal-cli.test.mjs"
    planning_only: true
    dependency_closure: "the proposal core/CLI plus positive and negative provenance, state, duplicate-marker, safety, form/label, release-ledger, and adoption fixtures"
    requirements: ["DKBWS-UPDATE-002", "DKBWS-VERIFY-001"]
  - target: "fixtures/conforming/standard-proposal-valid/"
    role: "standard-proposal-positive-fixtures"
    classification: "adapt-from-release"
    source: "fixtures/conforming/standard-proposal-valid/"
    planning_only: true
    dependency_closure: "valid tracked record, byte-bound form, and offline remote form/label/issue/registry observations"
    requirements: ["DKBWS-UPDATE-002", "DKBWS-VERIFY-001"]
  - target: "fixtures/nonconforming/standard-proposal-state/"
    role: "standard-proposal-state-fixtures"
    classification: "adapt-from-release"
    source: "fixtures/nonconforming/standard-proposal-state/"
    planning_only: true
    dependency_closure: "invalid lifecycle transition fixture and proposal validator"
    requirements: ["DKBWS-UPDATE-002", "DKBWS-VERIFY-001"]
  - target: "fixtures/nonconforming/standard-proposal-safety/"
    role: "standard-proposal-safety-fixtures"
    classification: "adapt-from-release"
    source: "fixtures/nonconforming/standard-proposal-safety/"
