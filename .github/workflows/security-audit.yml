name: Scheduled security audit
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          python-version: "3.12.16"
          require-checksums: true
      - name: Install the reference npm CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.21.3
      - run: test "$(npm --version)" = "11.21.3"
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run check:toolchain
      - run: npm run audit:node
      - run: npm run audit:python
      - run: npm run prepare:runtime && npm run check:runtime
