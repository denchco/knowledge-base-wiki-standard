name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          python-version: "3.12.16"
          require-checksums: true
      - name: Install the reference npm CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund npm@11.21.3
      - name: Check npm reference version
        run: test "$(npm --version)" = "11.21.3"
      - run: npm ci
      - name: Qualify changes to the uv installer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git diff --quiet "$BASE_SHA" HEAD -- .github/workflows/verify.yml .github/workflows/security-audit.yml scripts/test-setup-uv-download.mjs; then
            node scripts/test-setup-uv-download.mjs
          fi
      - run: uv sync --frozen
      - run: npm run browser:install:ci
      - name: Verify Git-distributed contract
        run: npm run verify
        env:
          DKBWS_PROVENANCE_MODE: distribution
